auth:
  enabled: true

mqtt:
  host: 127.0.0.1
  port: 1883

detectors:
  coral:
    type: edgetpu
    device: usb

ffmpeg:
  hwaccel_args: preset-vaapi

lpr:
  enabled: true
  model_size: medium
  min_area: 1000
  min_plate_length: 5
  recognition_threshold: 0.85

go2rtc:
  streams:
    oppkjorsel:
      - rtsp://frigate:Villa-larsnes1@192.168.1.62:554/Streaming/Channels/101
    platting:
      - rtsp://frigate:Villa-larsnes1@192.168.1.63:554/Streaming/Channels/101
    platting_sub:
      - rtsp://frigate:Villa-larsnes1@192.168.1.63:554/Streaming/Channels/102
    parkering:
      - rtsp://frigate:Villa-larsnes1@192.168.1.65:554/Streaming/Channels/101
    parkering_sub:
      - rtsp://frigate:Villa-larsnes1@192.168.1.65:554/Streaming/Channels/102
    kattemater:
      - rtsp://frigate:Villa-larsnes1@192.168.1.64:554/Streaming/Channels/101
    kattemater_sub:
      - rtsp://frigate:Villa-larsnes1@192.168.1.64:554/Streaming/Channels/102
    katteluke:
      - rtsp://admin:Villa-larsnes1@192.168.1.69:554/Streaming/Channels/101
    katteluke_sub:
      - rtsp://admin:Villa-larsnes1@192.168.1.69:554/Streaming/Channels/102
    babymonitor:
      - rtsp://frigate:Villa-larsnes1@192.168.1.66:554/Streaming/Channels/101
    babymonitor_sub:
      - rtsp://frigate:Villa-larsnes1@192.168.1.66:554/Streaming/Channels/102
      - ffmpeg:babymonitor#audio=aac
  homekit:
    babymonitor:
      pin: 19550224

cameras:
  oppkjorsel:
    snapshots:
      enabled: true
      retain:
        default: 30
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/oppkjorsel
          roles: [detect, record]
    detect:
      enabled: true
      width: 2560
      height: 1440
      fps: 15
    objects:
      track: [person, car]
      filters:
        person:
          min_score: 0.70
          threshold: 0.80
        car:
          mask: 
            0.925,0,0,0,0,0.139,0.382,0.127,0.528,0.133,0.556,0.154,0.503,0.186,0.716,0.283,0.79,0.241,0.857,0.218,0.904,0.175
    motion:
      mask: 
        0.301,0.319,0.22,0.395,0.1,0.389,0,0.351,0,0,0.548,0,1,0,1,0.562,0.733,0.537,0.659,0.416,0.718,0.321,0.816,0.264,0.867,0.222,0.871,0.161,0.835,0.112,0.743,0.082,0.573,0.057,0.566,0.138,0.454,0.201
    record:
      enabled: true

  platting:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/platting_sub
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/platting
          roles: [record]
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    objects:
      track: [person, car]
      filters:
        person:
          mask: 
            0.689,0,0.701,0.076,0.503,0.133,0.506,0.224,0.454,0.269,0.399,0.235,0.29,0.374,0.189,0.655,0.131,1,0,1,0,0.444,0.004,0.021
    record:
      enabled: true

  parkering:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/parkering_sub
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/parkering
          roles: [record]
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    objects:
      track: [person, car]
      filters:
        car:
          mask: 0.801,0,1,0,1,1,0.737,1,0.337,1,0.216,1,0.05,1
    record:
      enabled: true

  kattemater:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/kattemater_sub
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/kattemater
          roles: [record]
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    objects:
      track: [person, car]
    record:
      enabled: true

  katteluke:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/katteluke_sub
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/katteluke
          roles: [record]
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    objects:
      track: [person, car, cat]
    record:
      enabled: true

  babymonitor:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/babymonitor_sub
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/babymonitor
          roles: [record]
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    objects:
      track: []
    record:
      enabled: true

record:
  enabled: true
  alerts:
    retain:
      days: 14
  detections:
    retain:
      days: 14
  motion:
    days: 14

version: 0.17-0

logger:
  default: info
  logs:
    frigate.data_processing.common.license_plate: debug
